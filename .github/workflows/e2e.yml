name: E2E

# Runs the Playwright suite in tests/e2e. It drives a release `termul-server`
# and the built web client against a fake ACP agent (tests/e2e/fake-longrun-agent.ts),
# so it covers spawn, prompt streaming, permissions, elicitations, crash
# recovery and reconnect without a network LLM or credentials.
#
# On pull requests it runs only when ACP, relay or e2e files change, and it runs
# only the ACP lifecycle specs (14 of the 269 tests). The daily schedule and
# manual dispatch run every spec.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, develop, dev]
    paths:
      - '.github/workflows/e2e.yml'
      - 'tests/e2e/**'
      - 'src-tauri/src/acp/**'
      - 'src-tauri/src/web/**'
      - 'src/shared/types/web-protocol.types.ts'
      - 'src/renderer/lib/acp-*'
      - 'src/renderer/lib/acp-transport/**'
      - 'src/renderer/stores/acp-store/**'
  schedule:
    - cron: '0 19 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    name: Playwright e2e (termul-server)
    runs-on: ubuntu-22.04
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      # The web bundle must exist before the release build so rust-embed
      # embeds it, and tests/e2e/global-setup.ts refuses to start without it.
      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Assert dist-web/index.html exists
        run: test -f dist-web/index.html && test -s dist-web/index.html

      - name: Build termul-server (release)
        working-directory: src-tauri
        run: cargo build --release --bin termul-server --features standalone-server

      - name: Install Playwright Chromium
        run: bun run playwright install --with-deps chromium

      - name: Run e2e suite
        env:
          E2E_SPECS: ${{ github.event_name == 'pull_request' && 'agent-survival crash-recovery elicitation switch-responsiveness web-reopen-live-turn-tool-cards' || '' }}
        # An empty E2E_SPECS runs every spec. Playwright reads each word as a file filter.
        run: bun run test:e2e $E2E_SPECS

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: e2e-playwright-output
          path: tests/e2e/.playwright-out/
          if-no-files-found: ignore
          retention-days: 7
