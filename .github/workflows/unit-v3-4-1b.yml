name: Unit v3-4-1b (temporary)

# Temporary: proves the agent profile unit on macOS and Linux before the
# integration PR exists. Deleted before landing.

on:
  push:
    branches: [unit/v3-4-1b]

permissions:
  contents: read

concurrency:
  group: unit-v3-4-1b-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Agent profiles (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-14
          - name: Linux
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libdbus-1-dev \
            patchelf \
            xvfb

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          components: clippy

      - name: Cache Rust
        uses: swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          workspaces: src-tauri
          cache-on-failure: true

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.x

      - name: Install Bun dependencies
        run: bun install --frozen-lockfile

      - name: Build web client (dist-web/)
        run: bun run build:web

      - name: Cargo clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Install the Common-Controls manifest (Windows)
        if: runner.os == 'Windows'
        working-directory: src-tauri
        shell: pwsh
        run: ./tests/browser_conformance/build-windows-tests.ps1 --lib

      - name: Lib tests
        working-directory: src-tauri
        run: cargo test --lib -- browser_automation browser_tab browser_policy host_ticket

      - name: Agent profile real-engine fixture
        if: ${{ !cancelled() }}
        working-directory: src-tauri
        shell: bash
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: x11
          TERMUL_PROFILE_FIXTURE: "1"
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            pwsh -NoProfile -File ./tests/browser_conformance/build-windows-tests.ps1 --test browser_conformance
          fi
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1600x1000x24" cargo test --test browser_conformance -- --nocapture
          else
            cargo test --test browser_conformance -- --nocapture
          fi

      - name: Perimeter real-engine fixture (Windows, Linux)
        if: ${{ !cancelled() && runner.os != 'macOS' }}
        working-directory: src-tauri
        shell: bash
        env:
          WEBKIT_DISABLE_COMPOSITING_MODE: "1"
          WEBKIT_DISABLE_DMABUF_RENDERER: "1"
          GDK_BACKEND: x11
        run: |
          filter=host_perimeter::security_fixtures::engine
          if [ "$RUNNER_OS" = "Linux" ]; then
            xvfb-run -a --server-args="-screen 0 1600x1000x24" cargo test --lib "$filter" -- --ignored --test-threads=1 --nocapture
          else
            cargo test --lib "$filter" -- --ignored --test-threads=1 --nocapture
          fi
