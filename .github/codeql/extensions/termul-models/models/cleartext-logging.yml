extensions:
  - addsTo:
      pack: codeql/rust-all
      extensible: barrierModel
    data:
      # CLI stdout is the command result. These strings are profile ids and
      # display names, not credentials. CodeQL classifies the word "account"
      # as secret data and stdout as a log.
      # Free-function canonical path. The angle-bracket form is for methods;
      # both are listed so a path-shape mismatch does not leave the CLI prints flagged.
      - ["termul_manager_lib::acp::claude_admin::display_text", "ReturnValue", "log-injection", "manual"]
      - ["<termul_manager_lib::acp::claude_admin>::display_text", "ReturnValue", "log-injection", "manual"]
