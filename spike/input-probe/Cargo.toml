[package]
name = "input-probe"
version = "0.0.0"
edition = "2021"
publish = false

[workspace]

[dependencies]
tao = { version = "0.37", features = ["rwh_06"] }
wry = "=0.57.0"
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
gdk = "0.18"
glib = "0.18"
webkit2gtk = { version = "=2.0.2", features = ["v2_38"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-foundation = "0.3.2"
objc2-app-kit = "0.3.2"

[profile.release]
debug = false
